[package]
name = "houston"
version = "0.0.1"
edition = "2024"
description = "A terminal workspace where a knowledge vault and coding agents share one surface"
license = "MIT"
repository = "https://github.com/Sugar-Coffee/houston-ai"

[[bin]]
name = "houston"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
anyhow = "1.0"
alacritty_terminal = "0.25"
rustix = { version = "1.1.4", features = ["fs", "termios"] }
walkdir = "2.5.0"
pulldown-cmark = "0.13.4"
nucleo-matcher = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
ropey = "1.6.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
