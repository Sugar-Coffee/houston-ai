name: Release

on:
  push:
    tags: ["v*"]
  # Buildable by hand, so the pipeline can be exercised without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled from the arm64 runner rather than built on an Intel
          # one. macos-13 is the last Intel image and it is being retired: a
          # dispatch of this workflow sat queued for ten minutes waiting for
          # one while both other targets finished. The macOS SDK carries both
          # architectures, so this needs a target and nothing else.
          - os: macos-latest
            target: x86_64-apple-darwin
          # 22.04 rather than latest: the binary is linked against that
          # runner's glibc, and building on the newest Ubuntu produces
          # something that refuses to start on a two-year-old distro.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="dev"
          name="houston-${version}-${{ matrix.target }}"

          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/houston" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/" 2>/dev/null || true

          tar -czf "dist/${name}.tar.gz" -C dist "${name}"

          # A checksum beside every asset, so install.sh can verify what it
          # downloaded rather than trusting that a 200 means the right bytes.
          cd dist
          if command -v shasum >/dev/null; then
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*.tar.gz*

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/*.tar.gz.sha256
